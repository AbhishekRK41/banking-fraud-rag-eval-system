name: Mock backend CI

on:
  push:
    branches: [main]
    paths:
      - "fraud-agent-mock-backend/**"
      - ".github/workflows/mock-backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "fraud-agent-mock-backend/**"
      - ".github/workflows/mock-backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r fraud-agent-mock-backend/requirements.txt

      - name: Run tests
        working-directory: fraud-agent-mock-backend
        run: pytest -v
